[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "champollion-protocol"
version = "1.4.3"
description = "Translation protocol with offline mechanical checks and recorded judgement; does not translate or certify sense"
readme = "README.md"
license = "MIT AND CC-BY-4.0 AND CC0-1.0"
license-files = ["LICENSE", "LICENSE-docs", "examples/latin-to-spanish/CC0.md"]
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Michael Berardi" }]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
# Embedded woff2 fonts: fontTools re-saves the font, brotli decodes woff2.
fonts = ["fonttools>=4.0.1", "brotli>=1.0"]
# EPUB cover as JPEG instead of PNG.
images = ["Pillow>=10.0"]

[project.scripts]
champollion = "champollion.cli:main"

[project.urls]
Homepage = "https://github.com/your-github-username/champollion"
Documentation = "https://github.com/your-github-username/champollion/blob/v1.4.3/SPEC.md"
Repository = "https://github.com/your-github-username/champollion"
Issues = "https://github.com/your-github-username/champollion/issues"
Changelog = "https://github.com/your-github-username/champollion/blob/v1.4.3/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["champollion", "champollion.*"]

[tool.setuptools.package-data]
champollion = ["profiles/*.json", "schemas/*.json"]
