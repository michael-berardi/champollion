[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "champollion-protocol"
version = "1.0.0"
description = "Translation protocol with offline mechanical checks and recorded judgement; does not translate or certify sense"
readme = "README.md"
license = { text = "MIT (code); CC BY 4.0 (SPEC.md and docs/)" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Michael Berardi" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
]

[project.scripts]
champollion = "champollion.cli:main"

[project.urls]
Homepage = "https://github.com/michael-berardi/champollion"
Documentation = "https://github.com/michael-berardi/champollion/blob/v1.0.0/SPEC.md"
Repository = "https://github.com/michael-berardi/champollion"
Issues = "https://github.com/michael-berardi/champollion/issues"
Changelog = "https://github.com/michael-berardi/champollion/blob/v1.0.0/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "LICENSE-docs"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["champollion", "champollion.*"]

[tool.setuptools.package-data]
champollion = ["profiles/*.json"]
